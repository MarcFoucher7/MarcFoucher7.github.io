    <script>
      /* Langue et thème appliqués avant le premier rendu (pas de flash). */
      (function () {
        var root = document.documentElement;
        var get = function (k) {
          try {
            return localStorage.getItem(k);
          } catch (e) {
            return null;
          }
        };
        var param = new URLSearchParams(location.search).get('lang');
        var lang = param === 'en' || param === 'fr' ? param : get('lang');
        root.lang = lang === 'en' ? 'en' : 'fr';
        /* Sombre par défaut : la scène est pensée pour la nuit. */
        root.dataset.theme = get('theme') === 'light' ? 'light' : 'dark';
      })();
    </script>
